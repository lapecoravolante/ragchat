[project]
name = "ragchat"
version = "0.1.0"
description = "RAG Chat — chat with local LLM over your documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── Dipendenze cross-platform ──────────────────────────────────────────
    "langchain",
    "langchain-community",
    "langchain-huggingface",
    "faiss-cpu",
    "docling",
    "huggingface-hub",
    "sentence-transformers",

    # ── PyTorch ─────────────────────────────────────────────────────────────
    "torch",

    # ── LLM locale ──────────────────────────────────────────────────────────
    "llama-cpp-python",
]


# =============================================================================
# UV SOURCES
# =============================================================================

[tool.uv.sources]

# ── PyTorch ─────────────────────────────────────────────────────────────────
#
# Windows x64 + Python 3.12:
#   wheel CPU-only ufficiale PyTorch.
#
# Linux:
#   normale pacchetto PyPI.
#
torch = [
    {
        url = "https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp312-cp312-win_amd64.whl",
        marker = "sys_platform == 'win32' and platform_machine == 'AMD64'",
    },
]


# ── llama-cpp-python ────────────────────────────────────────────────────────
#
# Windows x64:
#   wheel CPU-only precompilata che già utilizzi con successo.
#
# Linux x86_64:
#   indice ufficiale contenente le wheel CPU precompilate.
#
llama-cpp-python = [
    {
        url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.35/llama_cpp_python-0.3.35-py3-none-win_amd64.whl",
        marker = "sys_platform == 'win32' and platform_machine == 'AMD64'",
    },
    {
        index = "llama-cpp-python-cpu",
        marker = "sys_platform == 'linux' and platform_machine == 'x86_64'",
    },
]


# =============================================================================
# INDICI UV
# =============================================================================

# Indice ufficiale delle wheel CPU precompilate di llama-cpp-python.
#
# explicit = true:
# questo indice viene utilizzato soltanto dai pacchetti che lo selezionano
# esplicitamente tramite tool.uv.sources.
#
[[tool.uv.index]]
name = "llama-cpp-python-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu/"
explicit = true


# =============================================================================
# ENTRY POINT
# =============================================================================

[project.scripts]
ragchat = "ragchat:main"


# =============================================================================
# BUILD SYSTEM
# =============================================================================

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"